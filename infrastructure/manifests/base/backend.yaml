apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcc-backend
  namespace: kcc-system
  labels:
    app: kcc-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kcc-backend
  template:
    metadata:
      labels:
        app: kcc-backend
    spec:
      serviceAccountName: kcc-backend
      containers:
      - name: backend
        image: ghcr.io/paulmmoore3416/kcc-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        env:
        - name: PORT
          value: "50051"
        - name: CLICKHOUSE_HOST
          value: "clickhouse.kcc-system.svc.cluster.local"
        - name: CLICKHOUSE_PORT
          value: "9000"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          exec:
            command: ["/bin/grpc_health_probe", "-addr=:50051"]
          initialDelaySeconds: 15
        readinessProbe:
          exec:
            command: ["/bin/grpc_health_probe", "-addr=:50051"]
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kcc-backend
  namespace: kcc-system
spec:
  type: ClusterIP
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    app: kcc-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcc-backend
  namespace: kcc-system
