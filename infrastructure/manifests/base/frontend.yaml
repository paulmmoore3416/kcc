apiVersion: apps/v1
kind: Deployment
metadata:
  name: kcc-frontend
  namespace: kcc-system
  labels:
    app: kcc-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kcc-frontend
  template:
    metadata:
      labels:
        app: kcc-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/paulmmoore3416/kcc-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: BACKEND_GRPC_URL
          value: "http://kcc-backend.kcc-system.svc.cluster.local:50051"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kcc-frontend
  namespace: kcc-system
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: kcc-frontend
